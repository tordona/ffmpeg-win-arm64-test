name: Delete old workflow runs

on:
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write # Required permission to delete runs
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2 # Example using the Mattraks action
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Default token provided by GitHub
          retain_days: 30 # Deletes runs older than 30 days
          keep_minimum_runs: 10 # Ensures at least 10 runs are always kept
          dry_run: true
