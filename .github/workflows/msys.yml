name: MSYS2 Clean

on:
  push:
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      # - '.github/**'
      - '.devcontainer/**'

env:
  msys_toolchain: "clang"

jobs:
  msys2:
    name: '💻 MSYS2 Environment'
    runs-on: windows-11-arm
    steps:
    - name: '🔧 Setup MSYS2'
      id: 'msys2-env'
      uses: msys2/setup-msys2@v2
      with:
        msystem: CLANGARM64
        update: true
        cache: true
        release: true
        install:
            make
    - name: '🏃‍➡️ Verify MSYS2 Install'
      run: |
        echo "📢 MSYS2 is installed at: ${{ steps.msys2-env.outputs.msys2-location }}"
        clang --version