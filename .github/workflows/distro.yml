name: Prepare Distribution

on:
  workflow_call:
    inputs:
      github_tag:
        type: string
        required: true 
      source_repo:
        type: string
        required: true 
      checkout_commit:
        type: string
        required: true 
    outputs:
      build_date:
        value: ${{ jobs.prep-distro.outputs.build_date }}
jobs:
  prep-distro:
    name: '💻 Prepare Distribution Package'
    runs-on: windows-11-arm
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      build_date: ${{ steps.build-date.outputs.build_date }}
    steps:
    - name: '🛒 Checkout'
      uses: actions/checkout@v5
    - uses: actions/download-artifact@v5
      with:
        path: ./
    - name: '📅 Make Build Date'
      id: 'build-date'
      run: |
        build_date=$(date '+%Y.%m.%d.0')
        echo "build_date=${build_date}" >> $GITHUB_OUTPUT
    - name: '🧹 Cleanup Files for Distribution'
      working-directory: ./
      run: |
        pwd
        ls -laR
        find . -type d -iname "dump" -exec rm -r {} +
        find . -type d -iname "examples" -exec rm -r {} +
        find . -type f -iname '*.lib' -delete
        find . -type f -iname '*.xsd' -delete
        find . -type f -iname '*.ico' -delete
    - name: '📝 Create Header Notes'
      id: 'header-notes'
      run: |
        pwd
        filename="header_notes.md"
        rm -f $filename
        printf "## Windows ARM64 builds\n" >> $filename
        printf "\n" >> $filename
    - name: '📝 Create Prerelease Notes'
      id: 'prerelease-notes'
      run: |
        pwd
        filename="prerelease_notes.md"
        rm -f $filename
        printf "\n" >> $filename
        printf "\n" >> $filename
        printf "**Source**\n" >> $filename
        printf "${{ inputs.source_repo }}/commit/${{ inputs.checkout_commit }}\n" >> $filename
    - name: '📝 Concat Release Notes'
      run: |
        pwd
        cd "${{ inputs.root_path }}"
        header_notes="header_notes.md"
        library_versions="library_versions.md"
        prerelease_notes="prerelease_notes.md"
        if [[ -f "$library_versions" ]]; then
          echo "$(<$library_versions)"
        fi
        if [[ -f "$prerelease_notes" ]]; then
          echo "$(<$prerelease_notes)"
        fi
        if [[ -f "$library_versions" && -f "$prerelease_notes" ]]; then
          cat "$header_notes" "$library_versions" "$prerelease_notes" > release_notes.md
        elif [[ ! -f "$library_versions" && -f "$prerelease_notes" ]]; then
          cat "$prerelease_notes" > release_notes.md 
        fi
    - name: '🚚 Package'
      shell: bash
      run: |
        origin=$(pwd)
        for link_type_dir in **/ffmpeg**/ffmpeg*; do
          if [[ -d $link_type_dir ]]; then
            build_dir=$(basename $link_type_dir)
            base_path=${link_type_dir//$build_dir/}
            cd $base_path
            7z a "$build_dir.7z" $build_dir
            sha256sum "$build_dir.7z" > "$build_dir.sha256"
          fi
          cd "$origin"
        done
    - name: '🚚 Package'
      shell: bash
      run: |
        pwd
        ls -laR
    - name: '📤 Upload artifact: package'
      uses: actions/upload-artifact@v6
      with:
        if-no-files-found: error
        name: "${{ inputs.version_name }}-prerelease"
        path: |
          ./**/${{ inputs.version_name }}.7z
          ./**/${{ inputs.version_name }}.sha256
          ./**/*.md