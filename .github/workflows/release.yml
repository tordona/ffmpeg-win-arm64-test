name: Release Distribution

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
      build_date:
        type: string
        required: true

env:
  release_tag: "weekly-autobuild"

jobs:
  release-distro:
    name: '💻 Release Distribution'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: '🛒 Checkout'
      uses: actions/checkout@v5
    - uses: actions/download-artifact@v5
      with:
        path: ./
    - name: '☑️ File Check'
      run: |
        pwd
        ls -laR
    - name: '🔖 Release Tag'
      run: |
        temp_release_tag=${{ inputs.release_tag }}
        if [[ "$temp_release_tag" == *"autobuild"* ]]; then
          echo "release_tag=${temp_release_tag}-${{ inputs.build_date }}" >> $GITHUB_ENV
        else
          echo "release_tag=${temp_release_tag}" >> $GITHUB_ENV
        fi
        echo "env.release_tag: ${{ env.release_tag }}"
    - name: '🔍 Check Build Release Exists'
      id: release-exists
      uses: insightsengineering/release-existence-action@v1.0.0
      with:
        release-tag: "${{ env.release_tag }}"
    - name: '📤 Upload to Existing Package Release'
      working-directory: ./
      if: steps.release-exists.outputs.release-exists == 'true' 
      run: |
        shopt -s globstar
        shopt -s nullglob
        pwd
        ls -laR
        gh release upload "${{ env.release_tag }}" \
          './**/*.7z' \
          './**/*.sha256' \
          --clobber \
    - name: '🔨 Create New Package Release'
      if: steps.release-exists.outputs.release-exists == 'false' 
      run: |
        shopt -s globstar
        shopt -s nullglob
        pwd
        ls -laR
        release_notes=$(find . -name "release_notes.md" -exec realpath {} \;)
        gh release create "${{ env.release_tag }}" \
          './**/*.7z' \
          './**/*.sha256' \
          --title "${{ env.release_tag }}" \
          --notes-file "$release_notes" \
          --draft \
          --prerelease
