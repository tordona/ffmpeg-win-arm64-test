name: Release Distribution

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
      build_date:
        type: string
        required: true
      github_tag:
        type: string
        required: true 

env:
  release_tag: "weekly-autobuild"

jobs:
  release-distro:
    name: '💻 Release Distribution'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: '🛒 Checkout'
      uses: actions/checkout@v6
    - uses: actions/download-artifact@v5
      with:
        path: ./release
        pattern: '*-prerelease'
    - name: '☑️ File Check'
      working-directory: ./release
      run: |
        pwd
        ls -laR
    - name: '🔍 Check Build Release Exists'
      id: release-exists
      uses: insightsengineering/release-existence-action@v1.0.0
      with:
        release-tag: "${{ inputs.release_tag }}"
    - name: '📤 Upload to Existing Package Release'
      working-directory: ./release
      if: steps.release-exists.outputs.release-exists == 'true' 
      run: |
        shopt -s globstar
        shopt -s nullglob
        gh release upload "${{ inputs.release_tag }}" \
          '**/*.7z' \
          '**/*.sha256' \
          --clobber \
    - name: '🔨 Create New Package Release'
      working-directory: ./release
      if: steps.release-exists.outputs.release-exists == 'false' 
      run: |
        shopt -s globstar
        shopt -s nullglob
        draft_flag=""
        if [[ "${{ inputs.release_tag }}" != *"autobuild"* && 
              "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          draft_flag="--draft"
        fi
        release_notes=$(find . -name "release_notes.md" -print -quit)
        if [[ -n "$release_notes" ]]; then
          echo "📢 Create New Package Release"
          gh release create "${{ inputs.release_tag }}" \
            '**/*.7z' \
            '**/*.sha256' \
            --title '${{ inputs.release_tag }}' \
            --notes-file $release_notes \
            $draft_flag
        fi
    - name: '🔖 Expired Daily Build Tag'
      id: 'expired-daily-autobuild-tag'
      run: |
        temp_removal_date=$(date '+%Y.%m.%d.0' -d 'today - 2 days')
        temp_removal_date="daily-autobuild-${temp_removal_date}"
        echo "📢 Expired tag: $temp_removal_date"
        echo "removal_date=${temp_removal_date}" >> $GITHUB_OUTPUT
    - name: '🔍 Check Expired Release Exists'
      id: expired-release-exists
      uses: insightsengineering/release-existence-action@v1.0.0
      with:
        release-tag: "${{ steps.expired-daily-autobuild-tag.outputs.removal_date }}"
    - name: '☠️ Delete Expired Build'
      if: steps.expired-release-exists.outputs.release-exists == 'true' 
      run: |
        gh release delete "${{ steps.expired-daily-autobuild-tag.outputs.removal_date }}" --cleanup-tag -y
    - name: '☠️ Delete Latest Build'
      run: |
        gh release delete "latest" --cleanup-tag -y
    - name: '🔨 Create Latest Release'
      working-directory: ./release
      run: |
        release_notes=$(find . -name "release_notes.md" -print -quit)
        if [[ ! -n "$release_notes" ]]; then
          exit 0
        fi
        if [[ "${{ inputs.release_tag }}" != *"daily-autobuild"* ]]; then
          exit 0
        fi
        echo "📢 Create Lastest Release"
        archives=$(find . -name *.7z)
        for archive in $archives; do
          filename=$(basename "$archive")
          path=$(dirname "$archive")
          rename="${filename//${{ inputs.github_tag }}/latest}"
          mv "$path/$filename" "$path/$rename"
        done
        find . -type f -iname "*.7z"
        gh release create "latest" \
          '**/*.7z' \
          '**/*.sha256' \
          --title 'Latest Auto-Build - ${{ inputs.build_date }}' \
          --notes-file $release_notes \
          --latest

  