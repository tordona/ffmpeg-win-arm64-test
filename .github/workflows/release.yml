name: Release Distribution

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
      build_date:
        type: string
        required: true

env:
  release_tag: "weekly-autobuild"

jobs:
  release-distro:
    name: '💻 Release Distribution'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: '🛒 Checkout'
      uses: actions/checkout@v6
    - uses: actions/download-artifact@v5
      with:
        path: ./release
        pattern: '*-prerelease'
    - name: '☑️ File Check'
      working-directory: ./release
      run: |
        pwd
        ls -laR
    - name: '☑️ File Check2'
      run: |
        release_notes=$(find . -name "release_notes.md")
        if [[ -f "$release_notes" ]]; then
          echo $release_note
          cp $release_notes ./release
          cd release
          ls -la
        fi
    - name: '🔍 Check Build Release Exists'
      id: release-exists
      uses: insightsengineering/release-existence-action@v1.0.0
      with:
        release-tag: "${{ inputs.release_tag }}"
    - name: '📤 Upload to Existing Package Release'
      working-directory: ./release
      if: steps.release-exists.outputs.release-exists == 'true' 
      run: |
        shopt -s globstar
        shopt -s nullglob
        gh release upload "${{ inputs.release_tag }}" \
          './ffmpeg**/**/*.7z' \
          './ffmpeg**/**/*.sha256' \
          --clobber \
    - name: '🔨 Create New Package Release'
      working-directory: ./release
      if: steps.release-exists.outputs.release-exists == 'false' 
      run: |
        shopt -s globstar
        shopt -s nullglob
        release_notes=$(find . -name "release_notes.md")
        gh release create "${{ inputs.release_tag }}" \
          './ffmpeg**/**/*.7z' \
          './ffmpeg**/**/*.sha256' \
          --title '${{ inputs.release_tag }}' \
          --notes-file $release_notes \
          --draft \
          --prerelease
    - name: '☑️ Check release_notes asset'
      if: success()
      run: |
        echo "Check if release_notes.md was added to assets"
        if gh release view "${{ inputs.release_tag }}" --json assets | grep -q "release_notes.md"; then
          echo "Delete file passed from notes-file flags because just why?"
          gh release delete-asset "${{ inputs.release_tag }}" \
            "release_notes.md" -y
        fi