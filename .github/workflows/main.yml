name: FFmpeg Win-ARM64 Auto-Builds

on:
  # schedule:
  #   - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag Name for Release'
        required: false
        type: string
      github_tag:
        description: 'Version tag to build'
        required: false
        type: string
      build_type:
        description: 'Build type of included libraries'
        required: true
        default: 'essentials'
        type: choice
        options:
        - essentials
        - full
      link_type:
        description: 'Link type of libraries'
        required: true
        default: 'shared'
        type: choice
        options:
        - shared
        - static
      msystem:
        description: 'MSYS2 System Environment'
        required: true
        default: 'CLANGARM64'
        type: choice
        options:
        - CLANGARM64
      environment:
        description: 'Deploy Environment'
        required: true
        default: 'base'
        type: environment
  push:
    paths-ignore:
      - '**.md'
      - '.vscode/**'
      # - '.github/**'
      - '.devcontainer/**'

# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: true

env:
  msys_toolchain: "clang"

jobs:
  defaults:
    name: '🥡 Setup Default Values'
    uses: ./.github/workflows/defaults.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      github_tag: ${{ inputs.github_tag }}
      build_type: ${{ inputs.build_type }}
      link_type: ${{ inputs.link_type }}
      msystem: ${{ inputs.msystem }}
      environment: ${{ inputs.environment }}
  ffmpeg-init:
    name: '⚡️ Initialize FFmpeg Configuration'
    needs: ['defaults']
    uses: ./.github/workflows/ffmpeg.yml
    with:
      github_tag: ${{ needs.defaults.outputs.github_tag }}
      build_type: ${{ needs.defaults.outputs.build_type }}
      link_type: ${{ needs.defaults.outputs.link_type }}
      msystem: ${{ needs.defaults.outputs.msystem }}
      major_version: ${{ needs.defaults.outputs.major_version }}
  msys2:
    name: '💻 MSYS2 Environment'
    runs-on: windows-11-arm
    needs: ['defaults', 'ffmpeg-init']
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: msys2 {0}
    outputs:
      version_name: ${{ needs.ffmpeg-init.outputs.version_name }}
      checkout_commit: ${{ steps.parse-commit.outputs.checkout_commit }}
    steps:
    - name: '🛒 Checkout'
      uses: actions/checkout@v5
    - name: '🔧 Setup MSYS2'
      id: msys2-env
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ needs.defaults.outputs.msystem }}
        update: true
        cache: true
        release: true
        install:
            gcc
            git
            make
        pacboy:
            toolchain:p
            gcc-compat:p
            diffutils:p
            libssh2:p
            jq:p
            github-cli:p
    - name: '🏃‍➡️ Verify MSYS2 Install'
      run: |
        echo "MSYS2 is installed at: ${{ steps.msys2-env.outputs.msys2-location }}"
        command="clang --version"
        eval $command
    - name: '🌪️ Clone FFmpeg source repository from Tag'
      if: ${{ github.event.inputs.github_tag != '' }}
      id: 'source-code-tag'
      run: |
        mkdir source
        git -c advice.detachedHead=false clone --branch ${{ needs.defaults.outputs.github_tag }} ${{ needs.defaults.outputs.source_repo }} ./source
    - name: '🌪️ Clone FFmpeg source repository from Latest'
      if: ${{ github.event.inputs.github_tag == '' }}
      id: 'source-code-latest'
      run: |
        mkdir source
        git -c advice.detachedHead=false clone ${{ needs.defaults.outputs.source_repo }} ./source
    - name: 'Translate Unix Path to MSYS'
      id: 'msys-build-config'
      run: |
        # pw
        unix_path="/home/runner/work/"
        msys_path="/c/a/"
        build_config="${{ needs.ffmpeg-init.outputs.build_config }}"
        build_config="${build_config/$unix_path/$msys_path}"
        echo $build_config
    - name: '🌪️ Parse Commit Hash'
      id: 'parse-commit'
      run: |
        cd source
        commit=$(git rev-parse HEAD)
        echo "checkout_commit=${commit}" >> $GITHUB_OUTPUT
    # - name: '🪡 Create FFmpeg Distribution Configuration Bits'
    #   id: 'ffmpeg-config-setup'
    #   uses: ./.github/actions/ffmpeg 
    #   with:
    #     github_tag: ${{ needs.defaults.outputs.github_tag }}
    #     build_type: ${{ needs.defaults.outputs.build_type }}
    #     link_type: ${{ needs.defaults.outputs.link_type }}
    #     msystem: ${{ needs.defaults.outputs.msystem }}
    #     arch: ${{ needs.defaults.outputs.arch }}
    #     msys_path: ${{ steps.msys2-env.outputs.msys2-location }}
    #     build_config: ${{ needs.ffmpeg-init.outputs.build_config }}
    - name: "📦 Install packages - Essentials Build"
      working-directory: ./config
      run: |
        echo "Install required library packages - Essentials Build"
        major_version="${{ needs.defaults.outputs.major_version }}"
        packages=$(jq -r --arg version "$major_version" --arg prefix "${{ needs.defaults.outputs.package_prefix }}"  '[.options.standard[], .options.essentials[] | .[] | select(.version <= $version) | select(.custom != "true") | $prefix + "-" + .package] | join(" ")' options.json)
        pacman -S --disable-download-timeout --noconfirm --overwrite '*' $packages
    - name: "📦 Install packages - Full Build"
      if: ${{ needs.defaults.outputs.build_type == 'full' }}
      working-directory: ./config
      run: |
        echo "Install required library packages - Full Build"
        major_version="${{ needs.defaults.outputs.major_version }}"
        packages=$(jq -r --arg version "$major_version" --arg prefix "${{ needs.defaults.outputs.package_prefix }}"  '[.options.full[] | .[] | select(.version <= $version) | select(.custom != "true") | $prefix + "-" + .package] | join(" ")' options.json)
        pacman -S --disable-download-timeout --noconfirm --overwrite '*' $packages
    - name: "⬇️ Download External Packages"
      run: |
       mkdir packages
       gh release download "${{ env.msys_toolchain }}-${{ needs.defaults.outputs.arch }}" --pattern "*.zst" -D "./packages" -R tordona/mingw-packages
    - name: "➡️ Install External Packages"
      run: |
        echo "Install Custom Packages from External Repo"
        cd packages
        pacman -U --disable-download-timeout --overwrite '*' --noconfirm *.pkg.tar.zst
    - name: '🔨 Configure FFmpeg Build'
      env:
        major_version: "${{ needs.defaults.outputs.major_version }}"
        build_type: "${{ needs.defaults.outputs.build_type }}"
        build_config: "${{ needs.ffmpeg-init.outputs.build_config }}"
        build_file_ref: "${{ needs.ffmpeg-init.outputs.build_file_ref }}"
      continue-on-error: true
      working-directory: ./source
      run: |
        echo "Configure FFmpeg Build with Library Options"
        bash ../.github/scripts/config_ffmpeg.sh
    - name: '🪵 Log: Show FFmpeg Build Config'
      run: |
        log="./source/ffbuild/config.log"
        if [ -f "$log" ]; then
          cat ./source/ffbuild/config.log
        fi
    - name: '🌳 Log: Show FFmpeg Configuration Output'
      run: |
        if test -f "${{ needs.ffmpeg-init.outputs.build_file_ref }}"; then
          echo "$(<${{ needs.ffmpeg-init.outputs.build_file_ref }})"
        fi
    - name: '🥋 Modifiy Config Header and readme file'
      env:
        output_path: "${{ needs.ffmpeg-init.outputs.output_path }}"
        version_name: "${{ needs.ffmpeg-init.outputs.version_name }}"
        build_file_ref: "${{ needs.ffmpeg-init.outputs.build_file_ref }}"
        build_type: "${{ needs.defaults.outputs.build_type }}"
        link_type: "${{ needs.defaults.outputs.link_type }}"
        source_repo: "${{ needs.defaults.outputs.source_repo }}"
        git_dist_repo: "${{ needs.defaults.outputs.git_dist_repo }}"
        commit: "${{ steps.parse-commit.outputs.checkout_commit }}"
      working-directory: ./source
      run: |
        echo "Remove build distribution specifc configrations"
        bash ../.github/scripts/config_header.sh
    - name: '🪧 Copy Support Files'
      env:
        output_path: "${{ needs.ffmpeg-init.outputs.output_path }}"
        version_name: "${{ needs.ffmpeg-init.outputs.version_name }}"
        build_file_ref: "${{ needs.ffmpeg-init.outputs.build_file_ref }}"
      run: |
        echo "Copy support files to output directory"
        bash .github/scripts/support_files.sh
    - name: '🖥️ Get number of CPU cores'
      uses: SimenB/github-actions-cpu-cores@v2
      id: 'cpu-cores'
    - name: '🍳 Trigger Make Command'
      id: 'make-ffmpeg'
      working-directory: ./source
      run: |
        make -j${{ steps.cpu-cores.outputs.count }}
    - name: '📑 Parse Library Versions'
      env:
        output_path: "${{ needs.ffmpeg-init.outputs.output_path }}"
      working-directory: ./source
      run: |
        echo "Parse out library versions into markdown file"
        bash ../.github/scripts/library_versions.sh
    - name: '🏭 Trigger Install Command'
      id: 'install-ffmpeg'
      working-directory: ./source
      run: |
        make install -j${{ steps.cpu-cores.outputs.count }}
    - name: 'Test Path'
      id: 'install-ffmpeg2'
      run: |
        pwd
        ls -laR
    - name: '📤 Upload artifact: package'
      uses: actions/upload-artifact@v6
      with:
        if-no-files-found: error
        name: ${{ needs.ffmpeg-init.outputs.version_name }}
        path: |
          ./builds/**/*.*
  prep-distro:
    name: '🎞️ Prepare Distribution'
    uses: ./.github/workflows/distro.yml
    needs: ['defaults', 'msys2']
    with:
      root_path: "ffmpeg-${{ needs.defaults.outputs.link_type }}"
      version_name: "${{ needs.msys2.outputs.version_name }}"
      github_tag: "${{ needs.defaults.outputs.github_tag }}"
      source_repo: "${{ needs.defaults.outputs.source_repo }}"
      checkout_commit: "${{ needs.msys2.outputs.checkout_commit }}"
  release-distro:
    name: '🎞️ Release Distribution'
    uses: ./.github/workflows/release.yml
    needs: ['defaults', 'msys2', 'prep-distro']
    permissions:
      contents: write
    with:
      version_name: "${{ needs.msys2.outputs.version_name }}"
      build_date: "${{ needs.prep-distro.outputs.build_date }}"
